on:
  push:
    branches: main
    tags: 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to document
        required: true
        default: main
        type: string

name: pkgdown

permissions:
  contents: write

concurrency:
  group: pkgdown
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: macOS-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        run: |
          install.packages("remotes")
          install.packages("processx")
          remotes::install_deps(dependencies = TRUE)
          install.packages("pkgdown")
        shell: Rscript {0}

      - name: Install package
        run: R CMD INSTALL .

      - name: Deploy package
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git fetch origin gh-pages
          git worktree add --detach ../site FETCH_HEAD
          Rscript -e 'pkgdown::build_site_github_pages(dest_dir = "../site")'
          git show -s --format='Built site for torchvision: %H' HEAD > ../site-commit-message.txt
          git -C ../site add --all
          git -C ../site commit --allow-empty -F ../site-commit-message.txt
          git -C ../site push origin HEAD:gh-pages
